<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Лабораторна робота №6 — робота з DOM та подіями">
  <title>ЛР №6 — Робота з DOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/index.js" defer></script>
</head>
<body>
  <main class="task-app">
    <header class="task-app__header">
      <div>
        <p class="task-app__eyebrow">WEB-програмування · Лабораторна робота №6</p>
        <h1 class="task-app__title">Список завдань</h1>
        <p class="task-app__intro">Створюйте, редагуйте та видаляйте картки за допомогою DOM.</p>
      </div>
      <button class="button button--primary" id="add-task-button" type="button">
        <svg class="button__icon" aria-hidden="true"><use href="img/sprite.svg#plus"></use></svg>
        Додати завдання
      </button>
    </header>

    <section class="task-editor" id="editor-panel" hidden aria-labelledby="editor-title">
      <div class="task-editor__heading">
        <h2 class="task-editor__title" id="editor-title">Нове завдання</h2>
      </div>
      <form id="task-form" class="task-form">
        <label class="task-form__label" for="task-title">Назва завдання</label>
        <input class="task-form__input" type="text" id="task-title" name="title" maxlength="120" required>
        <label class="task-form__label" for="task-desc">Опис завдання</label>
        <textarea class="task-form__textarea" id="task-desc" name="description" rows="3" required></textarea>
        <div class="task-form__actions">
          <button class="button button--primary" id="submit-button" type="submit">Створити</button>
          <button class="button button--secondary" id="cancel-button" type="button">Скасувати</button>
        </div>
      </form>
    </section>

    <section class="task-section" aria-labelledby="task-section-title">
      <div class="task-section__heading">
        <h2 class="task-section__title" id="task-section-title">Мої завдання</h2>
        <p class="task-section__count" id="task-count" aria-live="polite">0 завдань</p>
      </div>
      <p class="task-section__empty" id="empty-message">Завдань поки немає. Додайте перше за допомогою кнопки вище.</p>
      <div class="task-list" id="task-list"></div>
    </section>
    <p class="task-app__status" id="status" role="status" aria-live="polite"></p>
  </main>

  <template id="task-template">
    <article class="task-card">
      <div class="task-card__content">
        <h3 class="task-card__title"></h3>
        <p class="task-card__desc"></p>
      </div>
      <div class="task-card__actions">
        <button type="button" class="button button--small button--secondary task-card__edit" data-action="edit" aria-label="Редагувати завдання">
          <svg class="button__icon" aria-hidden="true"><use href="img/sprite.svg#edit"></use></svg>
          Редагувати
        </button>
        <button type="button" class="button button--small button--danger task-card__delete" data-action="delete" aria-label="Видалити завдання">
          <svg class="button__icon" aria-hidden="true"><use href="img/sprite.svg#trash"></use></svg>
          Видалити
        </button>
      </div>
    </article>
  </template>
</body>
</html>
